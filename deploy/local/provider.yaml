apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-runpod
  namespace: crossplane-system
  labels:
    app.kubernetes.io/name: provider-runpod
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: provider-runpod
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provider-runpod
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: provider-runpod
      securityContext:
        runAsNonRoot: true
        # Numeric IDs let kubelet verify runAsNonRoot without trusting the
        # image's user name (distroless nonroot = 65532).
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider
          image: provider-runpod:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: healthz
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
