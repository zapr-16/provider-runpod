apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-runpod
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-runpod
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  # Safe-start: the CRD gate watches CustomResourceDefinitions cluster-wide
  # to know when this provider's own CRDs are Established before it
  # registers the controllers that depend on them.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  # Leader election locks.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - runpod.crossplane.io
    resources:
      - providerconfigs
      - providerconfigs/status
      - providerconfigs/finalizers
      - clusterproviderconfigs
      - clusterproviderconfigs/status
      - clusterproviderconfigs/finalizers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Usage records powering ProviderConfig in-use deletion protection.
  - apiGroups:
      - runpod.crossplane.io
    resources:
      - providerconfigusages
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - runpod.crossplane.io
    resources:
      - pods
      - pods/status
      - pods/finalizers
      - endpoints
      - endpoints/status
      - endpoints/finalizers
      - networkvolumes
      - networkvolumes/status
      - networkvolumes/finalizers
      - containerregistryauths
      - containerregistryauths/status
      - containerregistryauths/finalizers
      - templates
      - templates/status
      - templates/finalizers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-runpod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-runpod
subjects:
  - kind: ServiceAccount
    name: provider-runpod
    namespace: crossplane-system
