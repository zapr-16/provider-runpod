apiVersion: runpod.crossplane.io/v1alpha1
kind: Pod
metadata:
  name: provider-runpod-local-smoke
  namespace: default
  labels:
    app.kubernetes.io/name: provider-runpod-local-smoke
spec:
  providerConfigRef:
    # kind is required by the CRD schema; the whole-object default only
    # applies when providerConfigRef is omitted entirely.
    kind: ClusterProviderConfig
    name: default
  forProvider:
    imageName: python:3.11-slim
    gpuTypeIds:
      - YOUR_GPU_TYPE_ID
    gpuCount: 1
    cloudType: SECURE
    supportPublicIp: false
    dockerStartCmd:
      - python
      - -m
      - http.server
      - "8888"
    ports:
      - number: 8888
        protocol: http
    # Additional knobs supported by the Pod CRD (uncomment as needed):
    #
    # desiredState drives the lifecycle: RUNNING starts/resumes the pod,
    # EXITED stops it while keeping its volume (storage keeps billing).
    # Unset means RUNNING.
    # desiredState: EXITED
    #
    # Rent interruptible (Spot) capacity: cheaper, may be reclaimed.
    # Combine with recreateOnTerminate for auto-replacement.
    # interruptible: true
    #
    # Attach a pre-existing network volume (must be in the same data center).
    # networkVolumeId: YOUR_NETWORK_VOLUME_ID
    #
    # Authenticate against a private container registry.
    # containerRegistryAuthId: YOUR_CONTAINER_REGISTRY_AUTH_ID
    #
    # Create the pod from a RunPod template; fields set directly above
    # override the template's values server-side.
    # templateId: YOUR_TEMPLATE_ID
