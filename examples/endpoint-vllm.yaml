# Serverless vLLM endpoint: scale-to-zero, pay per active second.
# The controller implicitly creates and owns the backing RunPod template.
#
# Data-plane calls (status.atProvider.runtimeEndpoint / openAIBaseURL)
# require an "Authorization: Bearer <RunPod API key>" header — unlike pod
# proxy URLs, which are unauthenticated.
apiVersion: runpod.crossplane.io/v1alpha1
kind: Endpoint
metadata:
  name: vllm-small
  namespace: default
spec:
  providerConfigRef:
    # kind is required by the CRD schema; the whole-object default only
    # applies when providerConfigRef is omitted entirely.
    kind: ClusterProviderConfig
    name: default
  forProvider:
    imageName: runpod/worker-v1-vllm:v2.25.2
    env:
      - name: MODEL_NAME
        value: "Qwen/Qwen2.5-Coder-7B-Instruct"
    containerDiskInGb: 30
    # Ordered by rental priority; serverless uses GPU type IDs like pods.
    gpuTypeIds:
      - "NVIDIA GeForce RTX 3090"
      - "NVIDIA GeForce RTX 4090"
      - "NVIDIA L4"
    workersMin: 0        # scale to zero
    workersMax: 2
    idleTimeout: 60      # seconds
    flashBoot: true
    scalerType: QUEUE_DELAY
    scalerValue: 4
    # networkVolumeId: ""  # optional, for model weight caching (mutually exclusive with networkVolumeIds)
    # networkVolumeIds:    # optional, multiple network volumes (mutually exclusive with networkVolumeId)
    #   - "nv-abc123"
    #   - "nv-def456"
    # dataCenterIds:        # optional, restrict workers to specific data centers
    #   - "US-CA-1"
    #
    # CPU endpoints (create-only; cannot switch GPU<->CPU after creation):
    # computeType: CPU
    # vcpuCount: 4
    # cpuFlavorIds:
    #   - "cpu3c"
    #
    # CUDA pinning for GPU endpoints:
    # allowedCudaVersions:
    #   - "12.1"
    #   - "12.4"
    # minCudaVersion: "11.8"
    #
    # Template-carried knobs (echoed by GET /templates, so drift is detected):
    # dockerStartCmd:
    #   - "python3"
    #   - "handler.py"
    # dockerEntrypoint:
    #   - "/bin/sh"
    #   - "-c"
    # containerRegistryAuthId: "auth-id-from-a-ContainerRegistryAuth-resource"
  writeConnectionSecretToRef:
    name: vllm-small-conn
