---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: endpoints.runpod.crossplane.io
spec:
  group: runpod.crossplane.io
  names:
    categories:
    - crossplane
    kind: Endpoint
    listKind: EndpointList
    plural: endpoints
    singular: endpoint
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          An Endpoint is a managed RunPod serverless endpoint: autoscaled GPU
          workers with scale-to-zero, billed per active second.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EndpointSpec defines the desired state of a RunPod serverless
              Endpoint.
            properties:
              forProvider:
                description: |-
                  EndpointParameters define the desired state inputs for a RunPod
                  serverless endpoint. By default (imageName set) the controller implicitly
                  manages the backing RunPod template: Create provisions the template then
                  the endpoint, Delete removes both, and template drift is folded into
                  endpoint drift. In templateId mode, the endpoint instead references an
                  existing template owned elsewhere, and the controller never creates,
                  patches, or deletes any template.
                properties:
                  allowedCudaVersions:
                    description: CUDA versions the workers are allowed to run on.
                    items:
                      type: string
                    type: array
                  computeType:
                    description: |-
                      Worker compute class: GPU or CPU. Create-only; RunPod does not allow
                      changing an endpoint's compute type after creation, and it is absent
                      from the PATCH schema.
                    enum:
                    - GPU
                    - CPU
                    type: string
                  containerDiskInGb:
                    description: Size of the ephemeral container disk in GiB (carried
                      by the template).
                    format: int32
                    type: integer
                  containerRegistryAuthId:
                    description: |-
                      ID of the container registry credentials used to pull the image
                      (carried by the template).
                    type: string
                  cpuFlavorIds:
                    description: Ordered list of acceptable RunPod CPU flavor IDs
                      for CPU endpoints.
                    items:
                      type: string
                    type: array
                  dataCenterIds:
                    description: Restrict workers to specific RunPod data center IDs.
                    items:
                      type: string
                    type: array
                  dockerEntrypoint:
                    description: Entrypoint overriding the image's default (carried
                      by the template).
                    items:
                      type: string
                    type: array
                  dockerStartCmd:
                    description: Command RunPod runs to start the container (carried
                      by the template).
                    items:
                      type: string
                    type: array
                  env:
                    description: Environment variables injected into the workers (carried
                      by the template).
                    items:
                      description: EnvVar defines an environment variable passed to
                        the pod container.
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  executionTimeoutMs:
                    description: Maximum milliseconds a single request may run on
                      a worker.
                    format: int32
                    type: integer
                  flashBoot:
                    description: Enable FlashBoot for faster cold starts.
                    type: boolean
                  gpuCount:
                    description: Number of GPUs attached to each worker.
                    format: int32
                    type: integer
                  gpuTypeIds:
                    description: |-
                      Ordered list of acceptable RunPod GPU type IDs for the workers
                      (e.g. "NVIDIA GeForce RTX 3090"). Order determines rental priority.
                      Note: the REST API selects serverless workers by GPU type IDs,
                      the same identifiers used for pods — not by VRAM tier.
                    items:
                      type: string
                    type: array
                  idleTimeout:
                    description: Seconds a worker may sit idle before being scaled
                      down (RunPod default 5).
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                  imageName:
                    description: |-
                      Container image the serverless workers run, e.g. runpod/worker-v1-vllm:stable.
                      Mutually exclusive with templateId.
                    type: string
                  minCudaVersion:
                    description: Minimum CUDA version required on the workers.
                    type: string
                  networkVolumeId:
                    description: Network volume to attach to the workers, e.g. for
                      model weight caching.
                    type: string
                  networkVolumeIds:
                    description: |-
                      Network volumes to attach to the workers, for multi-volume mounting.
                      Mutually exclusive with networkVolumeId.
                    items:
                      type: string
                    type: array
                  recycleWorkersOnTemplateChange:
                    default: true
                    description: |-
                      Recycle running/idle workers after the implicit template changes
                      (image/env/disk), by cycling workersMax through 0. Without this,
                      FlashBoot standby workers keep serving the old template
                      indefinitely. Defaults to true. Ignored in templateId mode.
                    type: boolean
                  scalerType:
                    description: Autoscaling strategy, QUEUE_DELAY or REQUEST_COUNT.
                    enum:
                    - QUEUE_DELAY
                    - REQUEST_COUNT
                    type: string
                  scalerValue:
                    description: |-
                      Threshold for the scaler: queue seconds for QUEUE_DELAY, queued
                      requests per worker for REQUEST_COUNT (RunPod default 4).
                    format: int32
                    type: integer
                  templateId:
                    description: |-
                      Existing RunPod template to run the endpoint from, e.g. one managed
                      by a Template resource. Mutually exclusive with imageName and the
                      other template-carried fields (env, containerDiskInGb,
                      dockerStartCmd, dockerEntrypoint, containerRegistryAuthId): when
                      templateId is set the controller does NOT create, patch, or delete
                      any template — the referenced template is owned elsewhere.
                    type: string
                  vcpuCount:
                    description: Number of vCPUs allocated per worker for CPU endpoints.
                    format: int32
                    type: integer
                  workersMax:
                    description: Maximum number of concurrently running workers.
                    format: int32
                    minimum: 0
                    type: integer
                  workersMin:
                    description: Minimum number of always-on workers. 0 enables scale-to-zero.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: networkVolumeId and networkVolumeIds are mutually exclusive
                  rule: '!(has(self.networkVolumeId) && has(self.networkVolumeIds))'
                - message: exactly one of imageName or templateId must be set
                  rule: has(self.imageName) != has(self.templateId)
                - message: template-carried fields cannot be set together with templateId
                  rule: '!has(self.templateId) || (!has(self.env) && !has(self.containerDiskInGb)
                    && !has(self.dockerStartCmd) && !has(self.dockerEntrypoint) &&
                    !has(self.containerRegistryAuthId))'
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: EndpointStatus reflects the observed state of a RunPod serverless
              Endpoint.
            properties:
              atProvider:
                description: EndpointObservation captures the observed state returned
                  by RunPod.
                properties:
                  endpointId:
                    description: RunPod serverless endpoint ID, mirrored from the
                      external name.
                    type: string
                  openAIBaseURL:
                    description: |-
                      OpenAI-compatible base URL served by RunPod's vLLM worker
                      (https://api.runpod.ai/v2/{endpointId}/openai/v1). Only meaningful
                      when the image implements the OpenAI route.
                    type: string
                  runtimeEndpoint:
                    description: |-
                      Data-plane base URL (https://api.runpod.ai/v2/{endpointId}).
                      Requests require an Authorization: Bearer <RunPod API key> header —
                      unlike pod proxy URLs, which are unauthenticated.
                    type: string
                  templateId:
                    description: ID of the implicitly managed RunPod template backing
                      this endpoint.
                    type: string
                  workersReady:
                    description: Number of workers currently in RUNNING state.
                    format: int32
                    type: integer
                  workersTotal:
                    description: Total number of workers currently provisioned for
                      the endpoint.
                    format: int32
                    type: integer
                required:
                - workersReady
                - workersTotal
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
