---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pods.runpod.crossplane.io
spec:
  group: runpod.crossplane.io
  names:
    categories:
    - crossplane
    kind: Pod
    listKind: PodList
    plural: pods
    singular: pod
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Pod is a managed RunPod GPU workload.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodSpec defines the desired state of a RunPod Pod resource.
            properties:
              forProvider:
                description: PodParameters define the desired state inputs for a RunPod
                  pod.
                properties:
                  cloudType:
                    description: RunPod cloud class for scheduling, limited to SECURE
                      or COMMUNITY.
                    type: string
                  containerDiskInGb:
                    description: Size of the ephemeral container disk in GiB.
                    format: int32
                    type: integer
                  dockerStartCmd:
                    description: Command array passed to the container as its startup
                      command.
                    items:
                      type: string
                    type: array
                  env:
                    description: Environment variables injected into the container
                      at startup.
                    items:
                      description: EnvVar defines an environment variable passed to
                        the pod container.
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  gpuCount:
                    description: Number of GPUs requested for the pod.
                    format: int32
                    type: integer
                  gpuTypeIds:
                    description: Ordered set of acceptable RunPod GPU type IDs for
                      placement.
                    items:
                      type: string
                    type: array
                  imageName:
                    description: Container image to run for the pod workload.
                    type: string
                  ports:
                    description: Container ports to expose, later serialized to RunPod
                      "<port>/<protocol>" strings.
                    items:
                      description: Port defines a container port exposed by the pod.
                      properties:
                        number:
                          format: int32
                          type: integer
                        protocol:
                          type: string
                      required:
                      - number
                      type: object
                    type: array
                  recreateOnTerminate:
                    description: |-
                      RecreateOnTerminate causes the controller to clear the external
                      name and report the resource as missing whenever RunPod marks
                      the pod EXITED or TERMINATED (e.g. Spot reclaim, OOM, manual
                      console delete). Crossplane's next reconcile will then call
                      Create() and provision a fresh pod with the same spec. Useful
                      for Spot-backed workloads where occasional reclaim is expected
                      and continuous availability is preferred over preserving the
                      specific instance. Defaults to false (manual recreate).
                    type: boolean
                  supportPublicIp:
                    description: Request a public IP for COMMUNITY cloud pods so exposed
                      ports receive external mappings.
                    type: boolean
                  volumeInGb:
                    description: Size of the persisted pod volume in GiB.
                    format: int32
                    type: integer
                  volumeMountPath:
                    description: Mount path inside the container for the persisted
                      pod volume.
                    type: string
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: PodStatus reflects the observed state of a RunPod Pod resource.
            properties:
              atProvider:
                description: PodObservation captures the observed state returned by
                  RunPod.
                properties:
                  costPerHr:
                    description: Effective hourly pod cost from the RunPod observation
                      response.
                    type: number
                  desiredStatus:
                    description: Raw RunPod lifecycle status from GET /pods/{podId}.
                    type: string
                  driftDetected:
                    description: |-
                      True when mutable-looking spec fields (env, ports) diverge from the
                      running pod. RunPod pods are immutable, so drift cannot be reconciled
                      in place; it is surfaced here instead of blocking the Synced condition.
                    type: boolean
                  gpuDisplayName:
                    description: Human-readable GPU name from machine.gpuDisplayName,
                      or from the nested GPU object as fallback.
                    type: string
                  lastStartedAt:
                    description: Timestamp of the last pod start event, parsed from
                      the RunPod response.
                    format: date-time
                    type: string
                  networkingReady:
                    description: |-
                      Derived readiness flag, true when a connection endpoint is resolvable:
                      either an HTTP proxy URL or a public IP with port mappings.
                    type: boolean
                  podId:
                    description: RunPod pod ID returned by create and mirrored from
                      the external name.
                    type: string
                  portMappings:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: External port numbers keyed by RunPod port token,
                      absent during networking initialization.
                    type: object
                  publicIp:
                    description: Public IP assigned to the pod once networking is
                      ready.
                    type: string
                  runtimeEndpoint:
                    description: |-
                      Derived endpoint URL for the first HTTP port, served through RunPod's
                      TLS proxy (https://{podId}-{port}.proxy.runpod.net). Present as soon as
                      the pod ID is known; the proxy returns 502 until the workload listens.
                    type: string
                required:
                - networkingReady
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
