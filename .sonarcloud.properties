# SonarCloud Automatic Analysis configuration.
#
# Generated artifacts are excluded from analysis entirely: controller-gen
# emits them, and their internal repetition (deepcopy bodies, near-identical
# CRD schemas for sibling kinds) is not actionable duplication — the fix for
# any finding in them lives in the Go types they are generated from.
sonar.exclusions=**/zz_generated*.go,package/crds/**

# Table-driven Go tests intentionally mirror each other across controllers
# (same scenarios against Pod and Endpoint); that symmetry is idiomatic, so
# tests are excluded from copy-paste detection only — they remain analyzed
# for bugs and code smells.
sonar.cpd.exclusions=**/*_test.go
