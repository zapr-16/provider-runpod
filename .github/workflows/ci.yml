name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs so a compromised or moved
# tag cannot inject code into this pipeline.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Pin to go.mod: "stable" drifted to Go 1.27, and golangci-lint
          # v2.11.4 (built with Go 1.26) panics type-checking 1.27 files.
          go-version-file: go.mod

      - name: Run golangci-lint
        # v7+ is required for golangci-lint v2.x.
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # v2.3.0 was built with Go 1.24 — fails to load configs that
          # target Go 1.26+ (this project's go.mod is on 1.26.2).
          version: v2.11.4

  generate-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Verify generated code is up to date
        run: |
          make generate
          git diff --exit-code || (echo "generated code is out of date; run 'make generate' and commit the result" && exit 1)

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        # Pinned like the actions above: @latest would let an unreviewed
        # release into a job that runs on every PR.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race ./...

  build:
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build provider binary
        run: go build ./cmd/provider/
