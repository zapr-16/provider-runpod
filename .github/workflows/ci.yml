name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs so a compromised or moved
# tag cannot inject code into this pipeline.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Pin to go.mod: "stable" drifted to Go 1.27, and golangci-lint
          # v2.11.4 (built with Go 1.26) panics type-checking 1.27 files.
          go-version-file: go.mod

      - name: Run golangci-lint
        # v7+ is required for golangci-lint v2.x; pinned to the v9 line.
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          # v2.3.0 was built with Go 1.24 — fails to load configs that
          # target Go 1.26+ (this project's go.mod is on 1.26.x).
          version: v2.11.4

  generate-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Verify generated code is up to date
        run: |
          make generate
          git diff --exit-code || (echo "generated code is out of date; run 'make generate' and commit the result" && exit 1)

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        # No @version: installing from inside the module locks the tool to
        # the version pinned in go.mod/go.sum (via tools/tools.go), so the
        # resolution is reproducible and lockfile-enforced.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck
          govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race ./...

  build:
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build provider binary
        run: go build ./cmd/provider/

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install Crossplane CLI
        # Downloaded directly from the official cli.crossplane.io bucket and
        # verified against its published sha256 sum, rather than piping the
        # upstream install.sh through a shell, so a compromised or mutated
        # release asset cannot inject code into this pipeline.
        env:
          CROSSPLANE_CLI_VERSION: v2.5.0
          CROSSPLANE_CLI_SHA256: 065dd6b40c9ea5fc71e49900d5c924cc0bec7f58375922ddbde6b402f292347e
        run: |
          curl -sSL -o crossplane "https://cli.crossplane.io/stable/${CROSSPLANE_CLI_VERSION}/bin/linux_amd64/crossplane"
          echo "${CROSSPLANE_CLI_SHA256}  crossplane" | sha256sum -c -
          chmod +x crossplane
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane --help >/dev/null

      - name: Build the Crossplane package
        # Mirrors the release path's `make xpkg-build`: builds the .xpkg from
        # the committed package/ tree (crds + crossplane.yaml) so CI catches
        # the same package errors that would otherwise surface at release
        # time. This does not require the controller image referenced in
        # crossplane.yaml to exist locally.
        run: make xpkg-build
